<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slideplay by the numbers</title>
</head>
<body>
<div id="stage" class="sp-target"></div>
<script src="../../examples/generic/render.js"></script>
<script>
// slideplay by the numbers (English version; the Japanese version is demo/ja/bounce.html).
// It chooses the bounce entry style at deck level (info.motion, CONTRACT.md 2.2). render.js already marks stat
// values with data-sp-role="count", so the numbers count up from 0 when a slide appears.
// The numbers were counted from the repository at v1.6 (see the notes of each slide). Do not change slide IDs.
window.slideDeck = GenericSlides.createDeck({
  id: 'bounce',
  title: 'slideplay by the numbers',
  label: 'Bounce',
  home: '../../index.html',
  color: '#d9480f',
  motion: { send: true, entry: 'bounce', point: true },
  sections: [
    { id: 'A', title: 'The player' },
    { id: 'B', title: 'The tests' },
    { id: 'C', title: 'The contract' },
  ],
  slides: [
    { id: 'b01', type: 'title', title: 'slideplay by the numbers', subtitle: 'Counted from the repository itself', minutes: 0.5,
      notes: 'The bounce entry style: titles blur in, list items and cards rise, bars grow, stat cards pop and their numbers count up from 0. Press Down to see it on each slide. All numbers are as of v1.6 and were counted from the repository. The player\'s own UI text (help panel, buttons) is Japanese for now.' },

    { id: 'b02', type: 'stat', section: 'A', title: 'The player is a single file', minutes: 1,
      items: [
        { value: '4,379', label: 'lines', sub: 'player/player.js' },
        { value: '267', label: 'KB', sub: '273,167 bytes' },
        { value: '0', label: 'dependencies', sub: 'no build step, no CDN' },
      ],
      notes: 'As of v1.6. Lines: wc -l player/player.js = 4,379. Size: wc -c = 273,167 bytes, which is 266.8 KiB, shown as 267 KB. Dependencies: none (README: no build step, no CDN).' },

    { id: 'b03', type: 'bars', section: 'A', title: 'Lines of code by area', minutes: 1, max: 15617,
      items: [
        { label: 'tests/', value: 15617, display: '15617' },
        { label: 'player/', value: 4379, display: '4379' },
        { label: 'editor/', value: 1860, display: '1860' },
        { label: 'examples/', value: 546, display: '546' },
        { label: 'CONTRACT.md', value: 223, display: '223' },
      ],
      notes: 'As of v1.6. Newline counts of the 70 files tracked by git at v1.6 (git ls-tree -r HEAD), added up per top-level folder; CONTRACT.md is a single file. Bar length is value / 15,617.' },

    { id: 'b04', type: 'stat', section: 'B', title: '1,189 tests', minutes: 1,
      items: [
        { value: '1,145', label: 'regular', sub: 'pytest -m "not webkit"' },
        { value: '44', label: 'WebKit', sub: 'reference only, optional' },
        { value: '1,189', label: 'in total', sub: 'pytest --collect-only' },
      ],
      notes: 'As of v1.6. python3 -m pytest --collect-only -q -m "not webkit" collects 1,145 (44 deselected); -m webkit collects 44; -m "" collects 1,189. The WebKit tests are a reference and do not decide whether the work is done.' },

    { id: 'b05', type: 'bars', section: 'B', title: 'Tests per file: the top five', minutes: 1, max: 115,
      items: [
        { label: 'links', value: 115, display: '115' },
        { label: 'ui', value: 102, display: '102' },
        { label: 'places', value: 89, display: '89' },
        { label: 'player_core', value: 74, display: '74' },
        { label: 'catalog', value: 63, display: '63' },
      ],
      notes: 'As of v1.6. From pytest --collect-only -q -m "" (all 1,189 tests), counted per file; the labels are tests/test_<name>.py. 34 test files in all.' },

    { id: 'b06', type: 'stat', section: 'C', title: 'The contract is small', minutes: 1,
      items: [
        { value: '7', label: 'sections', sub: 'CONTRACT.md, §0–§6' },
        { value: '7', label: 'slide types', sub: 'title, bullets, two, points, stat, bars, flow' },
        { value: '10', label: 'letter keys', sub: 'O H N F L P T M D E' },
        { value: '3', label: 'saved', sub: 'settings, places, memos' },
      ],
      notes: 'As of v1.6. Sections: the "##" headings of CONTRACT.md, sections 0 to 6 (7). Slide types: the types examples/generic/render.js can draw: title, bullets, two, points, stat, bars, flow (7). Letter keys: the letters listed in section 5 (O, H, N, F, L, P, T, M, D, E; 10). Saved: section 3.2 says the player stores only three things: settings, recent places and memos.' },

    { id: 'b07', type: 'flow', section: 'C', title: 'How a number counts up', minutes: 2,
      rows: [
        { nodes: [
            { t: 'Stat value', s: 'render.js marks it role "count"' },
            { t: 'Entry: bounce', s: 'Counts up from 0' },
            { t: 'Final text', s: 'Exactly what render drew' },
          ],
          arrows: [{ text: 'read by' }, { text: 'then' }] },
        { nodes: [
            { t: 'Press Down', s: 'The next slide appears and its entry plays' },
            { t: 'Move on', s: 'Or turn motion off: the slide jumps to its final look' },
            { t: 'Thumbnails, PDF', s: 'Always the plain render' },
          ] },
      ],
      notes: 'CONTRACT.md 2.6 and 3.2: the count role counts the first number of the text from 0 and then restores the original text. If you move on, change the step, turn motion off or have the OS "reduce motion" setting on, the slide jumps to its final look. Thumbnails, the side view, PDF and ?render always show the plain render result, with no motion.' },

    { id: 'b08', type: 'title', title: 'slideplay', subtitle: 'github.com/dmasubuchi/slideplay', minutes: 0.5,
      notes: 'MIT licensed. https://github.com/dmasubuchi/slideplay . The numbers on these slides are as of v1.6.' },
  ],
});
</script>
<script src="../../player/player.js"></script>
</body>
</html>
