[pytest]
testpaths = tests
# WebKit（Safari 相当）の参考の試験は既定では走らせない。走らせるとき：python3 -m pytest -m webkit -v
# （あとから渡した -m が、ここの -m を上書きする）
addopts = -m "not webkit"
markers =
    webkit: WebKit の参考の試験（iPad の Safari を想定した参考。失敗しても完成の条件ではない）。結果は環境変数 SLIDE_PLAYER_WORK_ROOT が指すフォルダー（未設定なら一時フォルダー）の webkit-report.json に書く
